name: Deploy site

# Deploys site/ to the Cloudflare Pages project "rosetta" (direct upload) on
# pushes to main that touch the site or the content it reads (README.md,
# package.json). PRs get a preview deployment. Skipped when the Cloudflare
# secrets aren't configured (e.g. on forks).
#
# Secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "package.json", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "README.md", "package.json", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm exec wrangler pages deploy dist --project-name rosetta --branch "$BRANCH" --commit-hash "$GITHUB_SHA"
