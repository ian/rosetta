name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke test (via .bin symlink)
        run: |
          ln -s "$PWD/dist/esm/cli.js" /tmp/rosetta
          /tmp/rosetta --help | grep -q "rosetta <command>"
          /tmp/rosetta --version
          # End-to-end without a model: init, adopt existing translations, check.
          mkdir -p /tmp/smoke/messages && cd /tmp/smoke
          echo '{"hello":"Hello {name}"}' > messages/en.json
          echo '{"hello":"Hola {name}"}' > messages/es.json
          /tmp/rosetta init --yes
          /tmp/rosetta push
          /tmp/rosetta check